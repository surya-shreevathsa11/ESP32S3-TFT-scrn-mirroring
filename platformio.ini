; PlatformIO project for TFT Screen Mirror
; ESP32-S3 XIAO + 128x128 ST7735 TFT

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    ; TFT_eSPI: ST7735 128x128 on XIAO ESP32-S3
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=128
    -D ST7735_BLACKTAB
    ; Use HSPI so TFT has its own SPI bus (avoids FSPI/flash conflict and init crash)
    -D USE_HSPI_PORT
    ; Pins: CS=D2/3, DC=D3/4, RST=D4/5, BL=D5/6, SCK=D8/7, MOSI=D10/9
    -D TFT_CS=3
    -D TFT_DC=4
    -D TFT_RST=5
    -D TFT_BL=6
    -D TFT_MOSI=9
    -D TFT_SCLK=7
    -D TFT_MISO=-1
    -D SPI_FREQUENCY=27000000
    -D TOUCH_CS=-1
